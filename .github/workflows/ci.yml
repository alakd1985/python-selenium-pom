name: Selenium Framework CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Run Ruff
        run: |
          python -m ruff check .

      - name: Check MediShop availability
        run: |
         curl -I -L --max-time 30 https://www.way2automation.com/MediShopWebApp/login.html

      - name: Run Selenium tests
        env:
          HEADLESS: "true"
        run: |
          pytest
